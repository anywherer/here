name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least-privilege default permissions at the top level
permissions:
  contents: read

# Allow one concurrent deployment, queuing subsequent runs to avoid race conditions
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so Quartz can generate accurate note dates (created/modified)
          fetch-depth: 0

      - name: Update submodules
        # Combines init, recursion, and remote branch tracking into one single network step
        run: git submodule update --init --recursive --remote

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # --frozen-lockfile ensures deterministic, faster CI builds without altering bun.lockb/bun.lock
        run: bun install --frozen-lockfile

      - name: Build Quartz
        # Runs via Bun directly instead of spinning up Node through npx
        run: bun run quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Grant Pages and OIDC permissions strictly to the deploy job
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4