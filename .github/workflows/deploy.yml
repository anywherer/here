name: Deploy to GitHub Pages

on:
  push:
    branches: [main]       # Runs automatically whenever you push to main
  workflow_dispatch:       # Allows you to trigger it manually via GitHub UI

# Permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from conflicting
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Website with Bun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup GitHub Pages metadata
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install

      - name: Build Astro site
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
